{% load static %}
<link rel="stylesheet" href="{% static 'attendance_app/home.css' %}">
<link rel="stylesheet" href="{% static 'attendance_app/edit.css' %}">

<form method="POST" action="{% url 'edit_student' student.id %}">
    {% csrf_token %}

    <input type="text" name="student_name" value="{{ student.student_name }}" required>

    <input type="text" name="roll_no" value="{{ student.roll_no }}" required>

    <input type="text" name="student_class" value="{{ student.student_class }}" required>

    <input type="text" name="department" value="{{ student.department }}" required>

    <input type="email" name="email" value="{{ student.email }}" required>

    <input type="text" name="phone_no" value="{{ student.phone_no }}" required>

    <button type="submit">
        Update Student
    </button>
</form>
